<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="description" content="Detailed motorcycle specifications 
		and premium MotoDrive models.">

    <title>MotoDrive | Motorcycle Details</title>

    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <!-- Header -->
    <header class="header">
      <div class="header-logo">
        <a href="index.html" class="logo">MotoDrive</a>
      </div>

      <div class="burger" id="burger">
        <span class="line"></span>
        <span class="line"></span>
        <span class="line"></span>
      </div>

      <nav class="nav" id="navMenu">
        <a href="#home" data-lang="navHome">Home</a>
        <a href="#bikes" data-lang="navBikes">Bikes</a>
        <a href="#about" data-lang="navAbout">About</a>
        <a href="#contact" data-lang="navContact">Contact</a>
      </nav>

      <div class="header-actions">
        <select class="language" id="languageSwitcher">
          <option class="lang-" value="en">EN</option>
          <option value="sk">SK</option>
        </select>

        <button class="cart-btn" id="cartBtn">
          🛒 <span id="cartCount">0</span>
        </button>
      </div>
    </header>

    <!-- Section Details -->
    <a href="index.html#bikes" class="btn back-btn"> ← Back to motorcycles </a>

    <section class="bike-page">
      <div class="bike-gallery">
        <img id="bikeImage" alt="Motorcycle photo" />
      </div>

      <div class="bike-info">
        <h1 id="bikeName"></h1>
        <p id="bikeBrand"></p>

        <div class="price" id="bikePrice"></div>

        <ul class="specs">
          <li><strong>Engine:</strong> <span id="bikeEngine"></span></li>
          <li><strong>Year:</strong> <span id="bikeYear"></span></li>
          <li><strong>Type:</strong> <span id="bikeType"></span></li>
        </ul>

        <button id="addBtn" class="btn">Add to Cart</button>
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <p>© 2025 MotoDrive</p>
      <p data-lang="footerText">Premium motorcycle dealership</p>
    </footer>

    <!-- Cart Section (Cart sidebar) -->
    <div class="cart" id="cart">
      <div class="cart-header">
        <h3>Your cart</h3>
        <button class="close-cart" onclick="closeCart()">✕</button>
      </div>

      <ul id="cartItems"></ul>

      <div class="cart-footer">
        <div
          class="cart-total"
          style="
            margin-bottom: 12px;
            font-size: 1.1rem;
            display: flex;
            justify-content: space-between;
          "
        >
          <span>Total:</span>
          <strong id="cartTotal">€0</strong>
        </div>

        <button
          class="btn checkout-btn"
          onclick="openCheckoutModal()"
          style="
            width: 100%;
            margin-bottom: 8px;
            background-color: var(--accent-primary, #e50914);
            color: white;
          "
        >
          Checkout
        </button>

        <button
          class="clear-cart"
          onclick="clearCart()"
          style="
            width: 100%;
            background: transparent;
            border: 1px solid #444;
            color: #888;
            padding: 8px;
            cursor: pointer;
          "
        >
          Clear cart
        </button>
      </div>
    </div>

    <!-- Checkout Modal (modal order window) -->
    <div class="modal" id="checkoutModal">
      <div class="modal-content modal-checkout">
        <button class="close-modal" onclick="closeCheckoutModal()">✕</button>

        <h2>Order Checkout</h2>

        <div class="checkout-summary">
          <p>Items in order: <strong id="checkoutItemsCount">0</strong></p>
          <p>Total amount: <strong id="checkoutTotalPrice">€0</strong></p>
        </div>

        <form id="checkoutForm" onsubmit="handleCheckoutSubmit(event)">
          <div class="form-group">
            <label for="clientName">Full Name *</label>
            <input
              type="text"
              id="clientName"
              placeholder="John Doe"
              required
            />
          </div>

          <div class="form-group">
            <label for="clientPhone">Phone Number *</label>
            <input
              type="tel"
              id="clientPhone"
              placeholder="+421 900 000 000"
              required
            />
          </div>

          <div class="form-group">
            <label for="clientEmail">Email *</label>
            <input
              type="email"
              id="clientEmail"
              placeholder="john@example.com"
              required
            />
          </div>

          <div class="form-group">
            <label for="deliveryMethod">Delivery Method</label>
            <select id="deliveryMethod">
              <option value="showroom">
                Showroom Pickup (Banská Bystrica)
              </option>
              <option value="delivery">Specialist Bike Delivery</option>
            </select>
          </div>

          <div class="form-group">
            <label for="paymentMethod">Payment Method</label>
            <select id="paymentMethod">
              <option value="cash">Pay at Showroom / On Delivery</option>
              <option value="card">Card / Bank Transfer</option>
              <option value="financing">Leasing / Financing Request</option>
            </select>
          </div>

          <button type="submit" class="btn-submit">
            Confirm & Place Order
          </button>
        </form>
      </div>
    </div>

    <script src="script.js"></script>

  </body>
</html>
